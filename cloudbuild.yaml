# Cloud Build pipeline for TriageZero (dashboard + API).
#
# Order matters and is deliberate:
#   1. run the test suites          - a broken build never reaches the registry
#   2. build both images
#   3. push both images
#   4. run schema migrations as a JOB, not on first request
#   5. deploy the API, then the dashboard
#
# Step 4 is the one people skip. Migrating inside the app's startup means a
# schema change races every instance Cloud Run starts, and a failure surfaces
# as request errors rather than a red build. Running it as its own step means
# a bad migration stops the deploy before any traffic moves.
#
# No secret appears in this file. Database credentials and API tokens are read
# from Secret Manager by the Cloud Run service at runtime; the only values
# passed at build time are public (the API URL and the Firebase web config).

substitutions:
  _REGION: us-central1
  _REPO: triagezero               # Artifact Registry repository
  _API_SERVICE: triagezero-api
  _WEB_SERVICE: triagezero-web
  _SQL_INSTANCE: ''               # PROJECT:REGION:INSTANCE
  _API_URL: ''                    # https://triagezero-api-....run.app
  _WEB_ORIGIN: ''                 # https://triagezero-web-....run.app
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_APP_ID: ''
  _GENAI_LOCATION: global         # Vertex AI location for Gemini

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8


steps:
  # --- 1. tests -------------------------------------------------------------
  - id: backend-tests
    name: python:3.11-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet ".[dev,postgres]"
        ruff check .
        pytest -q

  - id: frontend-tests
    name: node:22.23.2
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci
        npm run lint
        npx tsc -b
        npx vitest run

  # --- 2/3. build and push --------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['backend-tests']
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_API_SERVICE}:${SHORT_SHA}'
      - ./backend

  - id: build-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['frontend-tests']
    # Every VITE_* value is compiled into the bundle here. They are public by
    # design; a backend secret must never be passed as a build arg, because
    # build args are readable from the image's layer history.
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_WEB_SERVICE}:${SHORT_SHA}'
      - --build-arg
      - 'VITE_API_BASE_URL=${_API_URL}'
      - --build-arg
      - 'VITE_USE_MOCK_API=false'
      - --build-arg
      - 'VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - --build-arg
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - --build-arg
      - 'VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - --build-arg
      - 'VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - -f
      - Dockerfile.frontend
      - .

  # --- 3b. push before deploying -------------------------------------------
  # `gcloud run deploy` pulls from Artifact Registry, so the images must be
  # pushed here. The top-level `images:` field pushes only after every step has
  # finished - too late for a deploy step in the same build, which fails with
  # "Image not found" even though the build succeeded.
  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-api']
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_API_SERVICE}:${SHORT_SHA}'

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: ['build-web']
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_WEB_SERVICE}:${SHORT_SHA}'

  # --- 4. migrations ---------------------------------------------------------
  # There is deliberately NO separate migration step here.
  #
  # The DATABASE_URL secret uses the Cloud SQL socket form
  # (?host=/cloudsql/INSTANCE). That socket is created by the Cloud SQL Auth
  # Proxy that Cloud Run runs for services started with
  # --add-cloudsql-instances. A Cloud Build worker has no such socket, so a
  # migration step here would fail to connect no matter how it were configured.
  #
  # The application migrates on startup instead: init_db() runs create_all()
  # followed by run_migrations(), which is idempotent and applies inside a
  # single transaction, so a partial failure leaves the previous schema rather
  # than a half-migrated one. /api/v1/readyz then reports 503 until the schema
  # is actually present, so a revision that failed to migrate never receives
  # traffic - the gate still exists, it just lives in the readiness check.
  #
  # For a system with real traffic the better answer is a Cloud Run *job*
  # running `python -m app.db.migrate` with --set-cloudsql-instances, executed
  # before the service is deployed. That is the documented upgrade path; it is
  # not used here because a demo deployment gains little from it and every
  # extra resource is another thing that can fail.

  # --- 5. deploy ------------------------------------------------------------
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ['push-api']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_API_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_API_SERVICE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_SQL_INSTANCE}'
      # Gemini is reached through Vertex AI using the service account's own
      # credentials (roles/aiplatform.user). No API key exists to store or leak,
      # and the spend lands on this project's billing rather than a separate
      # API quota.
      - '--set-env-vars=APP_ENV=production,FRONTEND_ORIGINS=${_WEB_ORIGIN},ANALYZER_MODE=gemini,API_AUTH_REQUIRED=true,FIREBASE_AUTH_ENABLED=true,FIREBASE_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=${_GENAI_LOCATION}'
      - '--set-secrets=DATABASE_URL=triagezero-database-url:latest,INGESTION_API_TOKEN=triagezero-ingestion-token:latest,DASHBOARD_API_TOKEN=triagezero-dashboard-token:latest'
      - '--service-account=triagezero-api@${PROJECT_ID}.iam.gserviceaccount.com'
      # Scale-to-zero is fine for a demo, but a cold start that also has to
      # open a Cloud SQL connection is the slow first click a judge would see.
      - '--min-instances=1'
      - '--max-instances=4'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--timeout=120'

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ['deploy-api', 'push-web']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_WEB_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_WEB_SERVICE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=triagezero-web@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--min-instances=1'
      - '--max-instances=4'
      - '--cpu=1'
      - '--memory=512Mi'

